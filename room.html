<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ПЕСОЧНИЦА КОМНАТ (ТЗ 24.11): разборная комната из файла rooms/<id>.json, вход src/room_main.js. Только в предварительной
       и тестовой сборке (vite.config.js). Политика та же, что у игры, плюс 'wasm-unsafe-eval': Rapier - WebAssembly. Сети нет
       вовсе: комната, физика и тексты лежат в сборке. -->

  <meta name="robots" content="noindex">
  <title>ДРЕЙФ · песочница комнат</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; }
    #err { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; color: #fde467; font: 16px/1.4 system-ui, sans-serif; text-align: center; }
    #err[hidden] { display: none; }
  </style>
  <script type="module" crossorigin src="./room/room-DrSIIDT4.js"></script>
</head>
<body>
  <div id="err" hidden></div>
</body>
</html>
