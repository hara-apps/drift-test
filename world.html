<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- ВНЕШНИЙ МИР (ТЗ 26.11, docs/WORLDKIT.md): станция и астероид эпизода 1 с новым светом, небом и породой из
       worlds/<id>.json, вход src/world_main.js. Только в тестовой и локальной сборке (vite.config.js), как песочница
       комнат. Политика та же, что у игры, плюс 'wasm-unsafe-eval' и 'unsafe-eval': транскодер KTX2 (three.js basis_transcoder,
       embind) - WebAssembly и собирает обёртки функций через new Function. Сети и ввода игрока на странице нет. Для боевой
       игры (этап 5) это вопрос Рену: docs/WORLDKIT.md, «Вопросы». -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; connect-src 'self' data: blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="robots" content="noindex">
  <title>ДРЕЙФ · внешний мир</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
    canvas { display: block; }
    #err { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; color: #fde467; font: 16px/1.4 system-ui, sans-serif; text-align: center; }
    #err[hidden] { display: none; }
    #fps { position: fixed; left: 8px; top: 8px; padding: 6px 8px; background: rgba(0,0,0,.6); color: #cfe; font: 12px/1.35 ui-monospace, monospace; white-space: pre; pointer-events: none; }
    #fps[hidden] { display: none; }
    #cams { position: fixed; right: 8px; top: 8px; display: grid; gap: 4px; }
    #cams button { background: rgba(5,9,13,.75); color: #dfe6ee; border: 1px solid #2b3a48; border-radius: 4px; padding: 6px 10px; font: 13px system-ui, sans-serif; text-align: left; }
    #cams button.on { border-color: #84cbcd; color: #84cbcd; }
    #cams[hidden] { display: none; }
    #credits { position: fixed; left: 8px; bottom: 8px; max-width: min(40em, calc(100vw - 32px)); color: #8f9aa6; font: 11px/1.3 system-ui, sans-serif; pointer-events: none; }
  </style>
  <script type="module" crossorigin src="./world/world-J4LX2sWV.js"></script>
</head>
<body>
  <div id="err" hidden></div>
  <div id="fps" hidden></div>
  <div id="cams" hidden></div>
  <div id="credits"></div>
</body>
</html>
